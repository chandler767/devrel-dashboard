<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevRel Shorts Dashboard</title>
  <link rel="stylesheet" href="dashboard.css?v=2026-05-20T15-31-34Z" />
</head>
<body>

<header>
  <div class="header-left">
    <h1>DevRel Shorts Dashboard</h1>
    <div class="subtitle" id="last-updated">Loading…</div>
  </div>
  <div class="header-right">
    <button class="share-btn" id="share-btn">Share</button>
    <button class="export-btn" id="export-btn">Export image</button>
    <select class="report-select" id="report-select" title="Select report date"></select>
  </div>
</header>

<main>

  <!-- Top-level tab bar -->
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="stats">Stats</button>
    <button class="tab-btn" data-tab="ci">Content Intelligence</button>
  </div>

  <!-- ── Stats tab ──────────────────────────────────────────────────────── -->
  <div id="tab-stats">

    <!-- Metric selector — controls all charts and stats -->
    <div class="metric-tabs" id="metric-tabs">
      <button class="metric-tab active" data-metric="views">Views</button>
      <button class="metric-tab" data-metric="likes">Likes</button>
      <button class="metric-tab" data-metric="comments">Comments</button>
      <button class="metric-tab" data-metric="shares">Shares</button>
    </div>

    <!-- Rolling 12-month stats + trend chart -->
    <section class="rolling-section">
      <div class="rolling-heading-row">
        <div class="rolling-heading">Rolling 12 Month Cumulative <span id="rolling-metric-label">Views</span></div>
      </div>
      <div class="rolling-stats">
        <div class="stat-card total">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="rolling-total">—</div>
        </div>
        <div class="stat-card youtube">
          <div class="stat-label">YouTube</div>
          <div class="stat-value" id="rolling-yt">—</div>
        </div>
        <div class="stat-card tiktok">
          <div class="stat-label">TikTok</div>
          <div class="stat-value" id="rolling-tt">—</div>
        </div>
        <div class="stat-card linkedin">
          <div class="stat-label">LinkedIn</div>
          <div class="stat-value" id="rolling-li">—</div>
        </div>
      </div>
      <div class="trend-chart-container">
        <div class="trend-toggle" id="trend-toggle">
          <button class="trend-toggle-btn active" data-grouping="date">By release date</button>
          <button class="trend-toggle-btn" data-grouping="month">By month</button>
        </div>
        <canvas id="trend-chart"></canvas>
      </div>
    </section>

    <!-- Week-over-week chart -->
    <section class="wow-section">
      <div class="rolling-heading-row">
        <div>
          <div class="rolling-heading">Week over Week</div>
          <div class="wow-subheading" id="wow-subheading">Total accumulated views on videos published each week — not new views gained that week</div>
        </div>
      </div>
      <div class="trend-chart-container">
        <div class="trend-toggle wow-pred-toggle">
          <button class="trend-toggle-btn active" id="wow-pred-btn">Predictions: on</button>
        </div>
        <canvas id="wow-chart"></canvas>
        <div id="wow-trend-stat"></div>
      </div>
    </section>

    <div class="rolling-heading" id="selected-heading">Selected Time Totals</div>
    <!-- Summary stats -->
    <div class="summary">
      <div class="stat-card total">
        <div class="stat-label">Total <span id="summary-metric-label">Views</span></div>
        <div class="stat-value" id="total-views">—</div>
      </div>
      <div class="stat-card youtube">
        <div class="stat-label">YouTube</div>
        <div class="stat-value" id="yt-views">—</div>
      </div>
      <div class="stat-card tiktok">
        <div class="stat-label">TikTok</div>
        <div class="stat-value" id="tt-views">—</div>
      </div>
      <div class="stat-card linkedin">
        <div class="stat-label">LinkedIn</div>
        <div class="stat-value" id="li-views">—</div>
      </div>
    </div>

    <!-- Platform breakdown chart -->
    <div class="chart-container">
      <canvas id="views-chart"></canvas>
    </div>

    <!-- Date range filter -->
    <div class="range-tabs" id="range-tabs">
      <button class="range-tab" data-range="last7">Last 7 days</button>
      <button class="range-tab active" data-range="last30">Last 30 days</button>
      <button class="range-tab" data-range="last6mo">Last 6 months</button>
      <button class="range-tab" data-range="last12mo">Last 12 months</button>
      <button class="range-tab" data-range="ytd">Year to date</button>
      <button class="range-tab" data-range="all">All time</button>
      <button class="range-tab" data-range="custom">Custom</button>
    </div>

    <!-- Custom date range picker (shown only when Custom is active) -->
    <div class="custom-range" id="custom-range" hidden>
      <label for="custom-from">From</label>
      <input type="date" id="custom-from" />
      <label for="custom-to">to</label>
      <input type="date" id="custom-to" />
    </div>


    <!-- Video list (groups + single-platform, unified) -->
    <div class="section-heading">Videos</div>
    <div class="video-list" id="video-groups">
      <p class="state-message">Loading…</p>
    </div>

  </div><!-- /#tab-stats -->

  <!-- ── Content Intelligence tab ───────────────────────────────────────── -->
  <div id="tab-ci" hidden>
    <div class="ci-meta" id="ci-meta"></div>
    <div id="ci-results" class="ci-results"></div>
  </div><!-- /#tab-ci -->

</main>

<!-- Merge bar (only shown in local mode when videos are selected) -->
<div id="merge-bar" hidden>
  <span class="merge-bar-label"></span>
  <button class="merge-btn" disabled>Merge &amp; Download</button>
  <button class="merge-cancel-btn">Cancel</button>
</div>

<!-- Comments modal -->
<div id="comments-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <span id="modal-title" class="modal-title"></span>
      <button id="modal-close" class="modal-close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="dashboard.js?v=2026-05-20T15-31-34Z"></script>
</body>
</html>
